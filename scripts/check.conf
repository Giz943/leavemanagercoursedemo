# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Activated by spec 0001 (walking skeleton). Format: <name>: <command>; [fast] only in the NAME.
# macOS: run as `dash scripts/check` (docs/conventions.md, Known traps).
#
# --- Resource hygiene inventory (docs/testing.md) ---
# npm ci          : leaves no process; data: node_modules (deliberate cache, not run state).
# prettier/eslint : one-shot, leave no process.
# tsc --noEmit    : no watch mode → leaves no process.
# vitest          : `vitest run` + `watch: false` in vitest.config.ts; worker pool ends with the run.
#                   Data: integration tests use only in-memory SQLite → nothing on disk.
# vite build      : a build, not the dev server → leaves no process. The dev server never runs here.
# npm audit       : needs the network, leaves no process.
#
# --- Prerequisites ---
requires install: node -e "process.exit(+process.versions.node.split('.')[0] === 26 ? 0 : 1)"
requires typecheck: node -e "process.exit(+process.versions.node.split('.')[0] === 26 ? 0 : 1)"
requires audit: npm ping --silent
#
# --- Steps ---
# Full only: a clean install takes most of a minute; fast iterates on the installed tree.
install: npm ci --no-audit --no-fund --loglevel=error
format [fast]: node_modules/.bin/prettier --check . --log-level warn
lint [fast]: node_modules/.bin/eslint . --max-warnings=0
typecheck [fast]: npm run typecheck --silent
# resource hygiene: vitest run (no watch). Selector: everything except *.int.test.ts (Two speeds rule 4).
test-unit [fast]: node_modules/.bin/vitest run --exclude "**/*.int.test.ts" --coverage
# resource hygiene: vitest run (no watch); in-memory SQLite, no data on disk. Same selector, inverted.
test-integration: node_modules/.bin/vitest run .int.test.
build: npm run build --silent
audit: npm audit --audit-level=high
